name: Build & Release DeepChat Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.2)'
        required: true
      version_code:
        description: 'Android versionCode (optional, defaults to android/app/build.gradle)'
        required: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Lint
        run: |
          pnpm run type
          pnpm run lint

      - name: Resolve Release Version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION_NAME="${TAG#v}"
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            VERSION_CODE="${{ github.event.inputs.version_code }}"
          else
            VERSION_CODE="$(grep -oE 'deepchatVersionCode.*:[[:space:]]*[0-9]+' android/app/build.gradle | grep -oE '[0-9]+' | tail -n1 || echo 2)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build web bundle & sync Android assets
        run: |
          pnpm run build
          npx cap sync android
          node scripts/make-android-icons.mjs

      - name: Decode Android signing keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Missing SIGNING_KEYSTORE_BASE64 secret. Configure it in Repository Settings -> Secrets -> Actions so the APK shares the exact upgrade signature."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      - name: Build signed Release APK
        env:
          DEEPCHAT_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          DEEPCHAT_KEYSTORE_PASS: ${{ secrets.SIGNING_KEYSTORE_PASS || 'android' }}
          DEEPCHAT_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'androiddebugkey' }}
          DEEPCHAT_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS || 'android' }}
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PdeepchatVersionCode=${{ steps.ver.outputs.version_code }} \
            -PdeepchatVersionName=${{ steps.ver.outputs.version_name }} \
            --no-daemon

      - name: Prepare Release APK artifact
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/DeepChat-${{ steps.ver.outputs.tag }}.apk"
          rm -f android/release.keystore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DeepChat ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/DeepChat-${{ steps.ver.outputs.tag }}.apk
