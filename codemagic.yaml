# Codemagic CI —— 免费额度构建未签名 iOS IPA
#
# 用法：
#   1. 注册 https://codemagic.io （用 GitHub 账号，免费 500 分钟/月）
#   2. Add application → 选 LbbBb1/DeepChat → 选 "Other" 或 Flutter 之外的 iOS 类型
#   3. Codemagic 会读这个文件，点 Start new build 即可
#   4. 构建完在 Artifacts 里下载 DeepChat-unsigned.ipa
#
# 产物是未签名 IPA，装真机需要用 Sideloadly 自签（Windows 可做）。

workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 22
      xcode: latest
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App

    scripts:
      - name: Install pnpm
        script: |
          npm install -g pnpm@11

      - name: Install JS dependencies
        script: |
          pnpm install --frozen-lockfile

      - name: Build web bundle
        script: |
          pnpm run build

      - name: Sync iOS project (pod install)
        script: |
          npx cap sync ios

      - name: Build unsigned archive
        script: |
          set -o pipefail
          cd ios/App
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            archive

      - name: Package IPA
        script: |
          set -euo pipefail
          APP_PATH="$CM_BUILD_DIR/App.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Archive did not produce App.app"
            find "$CM_BUILD_DIR/App.xcarchive" -maxdepth 4 -type d
            exit 1
          fi
          rm -rf "$CM_BUILD_DIR/ipa"
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          zip -qry "$CM_BUILD_DIR/DeepChat-unsigned.ipa" Payload
          ls -lh "$CM_BUILD_DIR/DeepChat-unsigned.ipa"

    artifacts:
      - $CM_BUILD_DIR/DeepChat-unsigned.ipa

    publishing:
      email:
        recipients:
          - lbbbb1@users.noreply.github.com
        notify:
          success: true
          failure: true
